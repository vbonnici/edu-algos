<!DOCTYPE html>
<!-- saved from url=(0050)https://francescorosi3.github.io/NotteRicercatori/ -->
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Sfida l'algoritmo</title>

    <link
      rel="icon"
      type="image/ico"
      href="https://francescorosi3.github.io/NotteRicercatori/logo%20-%20Copia.png"
    />
    <link rel="stylesheet" href="./Sfida l&#39;algoritmo_files/index.css" />
    <link rel="stylesheet" href="./Sfida l&#39;algoritmo_files/css" />
    <script src="./Sfida l&#39;algoritmo_files/jquery-3.6.0.min.js.download"></script>
    <script src="./Sfida l&#39;algoritmo_files/jquery-ui.js.download"></script>
  </head>
  <body
    cz-shortcut-listen="true"
    data-new-gr-c-s-check-loaded="14.1264.0"
    data-gr-ext-installed=""
  >
    <header>
      <div id="cont">
        <a
          href="https://francescorosi3.github.io/NotteRicercatori/grid/index.html"
        >
          <img
            id="id_logo"
            src="./Sfida l&#39;algoritmo_files/logo.svg"
            style="width: 260px"
          />
        </a>
        <p id="uno" style="margin-top: 5px">
          Corso di Laurea in <span id="due"> Informatica</span>
        </p>
      </div>
    </header>
    <div class="subheader">
      <span>DIPARTIMENTO SCIENZE MATEMATICHE, FISICHE E INFORMATICHE</span>
    </div>

    <div class="grid-container" style="margin: 0% 5%">
      <div class="title">SFIDA L'ALGORITMO</div>
      <div
        class="Selection"
        style="background-color: rgb(68, 114, 196); color: rgb(255, 255, 255)"
      >
        Selection Sort
      </div>
      <div class="Bubble">Bubble Sort</div>
    </div>

    <script>
      ///////////////////////////////////// CARICAMENTO PAGINA //////////////////////////////////////////////////

      if (parseInt($("#id_logo").css("width").slice(0, -2)) < 150) {
        $("#id_logo").css("width", "260px");
      }

      if (parseInt($("html").css("width").slice(0, -2)) > 1200) {
        console.log("pc");
        //se sono su pc
        $(".grid-container").css("margin", "0% 5%");
        $("#uno").css("margin-top", "5px");
        $(".subheader").html(
          "<span>DIPARTIMENTO SCIENZE MATEMATICHE, FISICHE E INFORMATICHE</span>"
        );
      } else {
        //se sono su tablet cell
        console.log("smart");
        $(".grid-container").css("margin", "0% 10%");
        $(".subheader").addClass("shp");
      }
      ////////////////////////////////////////////////////////////////////////////////////

      $(".Selection").on({
        click: function () {
          $(location).attr("href", "grid/selectionsort.html");
        },

        mouseenter: function () {
          $(this).css("background-color", "white");
          $(this).css("color", "rgb(68,114,196)");
        },

        mouseleave: function () {
          $(this).css("background-color", "rgb(68,114,196)");
          $(this).css("color", "white");
        },
      });

      $(".Bubble").on({
        click: function () {
          $(location).attr("href", "grid/bubblesort.html");
        },

        mouseenter: function () {
          $(this).css("background-color", "white");
          $(this).css("color", "rgb(68,114,196)");
        },

        mouseleave: function () {
          $(this).css("background-color", "rgb(68,114,196)");
          $(this).css("color", "white");
        },
      });

      var testmob =
        /iphone|ipod|ipad|android|blackberry|mini|windows\sce|palm/i.test(
          navigator.userAgent.toLowerCase()
        );

      // //alert(window.navigator.userAgent);
      if (testmob) {
        /*Si sta utilizzando un dispositivo riconosciuto mobile*/
        //$(".selection").css('height','30%');
        //$(".bubble").css('height','30%');
      }
    </script>
  </body>
  <grammarly-desktop-integration data-grammarly-shadow-root="true"
    ><template shadowrootmode="open"
      ><style>
        div.grammarly-desktop-integration {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
          -moz-user-select: none;
          -webkit-user-select: none;
          -ms-user-select: none;
          user-select: none;
        }

        div.grammarly-desktop-integration:before {
          content: attr(data-content);
        }
      </style>
      <div
        aria-label="grammarly-integration"
        role="group"
        tabindex="-1"
        class="grammarly-desktop-integration"
        data-content='{"mode":"full","isActive":true,"isUserDisabled":false}'
      ></div></template
  ></grammarly-desktop-integration>
</html>
