<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sfida l'algoritmo</title>
      <link
      rel="icon"
      type="image/ico"
      href="https://francescorosi3.github.io/NotteRicercatori/logo%20-%20Copia.png"
    />
    <link rel="stylesheet" href="./Sfida l&#39;algoritmo_files/css" />
    <script src="./Sfida l&#39;algoritmo_files/jquery-3.6.0.min.js.download"></script>
    <script src="./Sfida l&#39;algoritmo_files/jquery-ui.js.download"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="sfida.css">
</head>
<body>
    <header>
      <div id="cont">
        <a
          href="https://francescorosi3.github.io/NotteRicercatori/grid/index.html"
        >
          <img
            id="id_logo"
            src="./Sfida l&#39;algoritmo_files/logo.svg"
            style="width: 260px"
          />
        </a>
        <p id="uno" style="margin-top: 5px">
          Corso di Laurea in <span id="due"> Informatica</span>
        </p>
      </div>
    </header>
     <div class="subheader">
      <span>DIPARTIMENTO SCIENZE MATEMATICHE, FISICHE E INFORMATICHE</span>
    </div>
        <!-- start here -->
    <div class="container">
   <div class="title"><h1>Lista di giochi</h1></div>
   <div class="game-list">
    <div class="game-item" id="bubble">
        <div class="icon-container">
            <img src="./BUBBLE SORT_files/Pasted image.png" alt="Bubble Sort">
        </div>
        <span class="game-name">Bubble Sort</span>
    </div>
    
    <div class="game-item" id="heap">
        <div class="icon-container">
            <img src="./HEAP SORT_files/Pasted image.png" alt="Heap Sort">
        </div>
        <span class="game-name">Heapify</span>
    </div>

    <div class="game-item" id="labirano">
        <div class="icon-container">
            <img src="./labirinto/icons/logo.svg" alt="Labirano">
        </div>
        <span class="game-name">Labirinto (Labirano)</span>
    </div>

    <div class="game-item" id="zaino">
        <div class="icon-container">
            <img src="./Zaino_Game/Pasted image.png" alt="Zaino Game">
        </div>
        <span class="game-name">Zaino</span>
    </div>

    <div class="game-item" id="selection">
        <div class="icon-container">
            <img src="./SELECTION SORT_files/Screenshot from 2025-12-06 21-57-52.png" alt="Selection Sort">
        </div>
        <span class="game-name">Selection Sort</span>
    </div>
</div>

      

   </div>
      <!-- end here  -->

    

    <script src="./sfida.js" ></script>
</body>
</html>
