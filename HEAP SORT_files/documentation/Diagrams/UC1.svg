<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <!-- System Boundary -->
  <rect x="189" y="40" width="300" height="250" fill="none" stroke="black" stroke-width="1"/>
  <text x="339" y="65" font-family="Arial" font-size="14" text-anchor="middle">Heap Sort Challenge</text>

  <!-- Use Case Oval -->
  <ellipse cx="339" cy="170" rx="75" ry="40" fill="white" stroke="black" stroke-width="1"/>
  <text x="339" y="165" font-family="Arial" font-size="12" text-anchor="middle">Seleziona Tipo Heap</text>
  <text x="339" y="180" font-family="Arial" font-size="12" text-anchor="middle">(Min/Max)</text>

  <!-- Actor -->
  <circle cx="95" cy="150" r="10" fill="white" stroke="black" stroke-width="1"/> <!-- Head -->
  <line x1="95" y1="160" x2="95" y2="190" stroke="black" stroke-width="1"/> <!-- Body -->
  <line x1="80" y1="170" x2="110" y2="170" stroke="black" stroke-width="1"/> <!-- Arms -->
  <line x1="95" y1="190" x2="80" y2="210" stroke="black" stroke-width="1"/> <!-- Leg L -->
  <line x1="95" y1="190" x2="110" y2="210" stroke="black" stroke-width="1"/> <!-- Leg R -->
  <text x="95" y="230" font-family="Arial" font-size="12" text-anchor="middle">Studente</text>

  <!-- Association Line -->
  <line x1="110" y1="170" x2="264" y2="170" stroke="black" stroke-width="1"/>
</svg>
